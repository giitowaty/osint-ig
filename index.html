<!doctype html>
<html lang="pl" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <title>OSINT-IG</title>
    <meta name="description" content="Analiza profili Instagram i mapa powiązań między kontami: statystyki, treści, odbiorcy, graf i centralności." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <script>
      // Motyw przed pierwszym malowaniem (bez błysku jasnego tła).
      try {
        var t = localStorage.getItem("osint-ig-theme") || "dark";
        var d = t === "dark" || (t === "system" && matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.classList.toggle("dark", d);
        document.documentElement.classList.toggle("light", !d);
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
