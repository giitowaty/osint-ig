<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OSINT-IG · Analiza profilu Instagram</title>
  <meta name="description" content="Wpisz profil Instagram i przeanalizuj jego statystyki." />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="logo">◎</span>
      <div>
        <h1>OSINT&#8209;IG</h1>
        <p class="tagline">Analiza profilu Instagram</p>
      </div>
    </div>
  </header>

  <main class="container">
    <form id="analyze-form" class="search-panel" autocomplete="off">
      <label class="field">
        <span>Profil do analizy</span>
        <div class="field-input">
          <span class="at">@</span>
          <input type="text" id="username" placeholder="nazwa_uzytkownika" spellcheck="false" />
        </div>
      </label>

      <button type="submit" id="analyze-btn" class="btn-primary">Analizuj</button>
    </form>

    <p id="status" class="status" role="status" aria-live="polite"></p>

    <section id="result" class="result" hidden></section>
  </main>

  <footer class="footer">
    <p>
      Dane pobierane z publicznego profilu IG przez CORS&#8209;proxy (best&#8209;effort).
      Gdy pobranie się nie uda, uzupełnij dane ręcznie.
      Używaj zgodnie z regulaminem Instagrama i prawem.
    </p>
  </footer>

  <script src="app.js"></script>
</body>
</html>
