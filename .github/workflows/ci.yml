# Testy przy każdym pushu i pull requeście: typecheck, lint, testy backendu
# i frontu, build produkcyjny oraz testy modułu Pythona.
# package-lock.json jest w .gitignore, dlatego `npm install`, a nie `npm ci`.
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Front + backend (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, node: "22" }
          - { os: ubuntu-latest, node: "20" }
          # Windows: launchery .bat, ścieżki profilu Firefoksa, sidecar .exe.
          - { os: windows-latest, node: "22" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Instalacja zależności
        run: npm install --no-audit --no-fund
      - name: Typecheck
        run: npx tsc -b
      - name: Lint
        run: npx eslint .
      - name: Testy (backend + bezpieczeństwo serwera + vitest)
        run: npm test
      - name: Build produkcyjny
        run: npx vite build

  python:
    name: Moduł social_analytics (Python)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalacja zależności
        run: pip install -r social_analytics/requirements.txt -r social_analytics/webapp/requirements.txt pytest
      - name: Testy
        run: python -m pytest -q social_analytics/tests
