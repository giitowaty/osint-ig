<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>social_analytics · dashboard</title>
  <link rel="stylesheet" href="/static/dashboard.css" />
</head>
<body>
  <header class="topbar">
    <span class="logo">◎</span>
    <div>
      <h1>social_analytics</h1>
      <p class="tagline">Dashboard analizy danych społecznościowych</p>
    </div>
  </header>

  <main class="wrap">
    <!-- Panel wejścia -->
    <section class="panel input-panel">
      <label for="username">Profil do sprawdzenia</label>
      <div class="fetch-row">
        <span class="at">@</span>
        <input id="username" type="text" placeholder="np. natgeo" spellcheck="false" />
        <button id="fetch" class="btn-primary fetch-btn">Pobierz</button>
      </div>
      <div class="divider">albo wklej dane JSON ręcznie</div>

      <label for="input">Dane JSON (profil + posty)</label>
      <textarea id="input" spellcheck="false" placeholder='{"profile": {...}, "posts": [...]}'></textarea>
      <div class="actions">
        <button id="analyze" class="btn-primary">Analizuj</button>
        <button id="load-sample" class="btn-ghost">Przykład</button>
      </div>
      <p id="status" class="status"></p>
    </section>

    <!-- Wyniki -->
    <section id="results" class="results hidden">
      <div id="acct" class="panel acct-card"></div>

      <div id="stats" class="stat-grid"></div>

      <div class="two-col">
        <div class="panel">
          <h2 class="section-title">Rozkład tematyczny</h2>
          <div id="topics"></div>
        </div>
        <div class="panel">
          <h2 class="section-title">Ranking wpływu (centralności)</h2>
          <ul id="influence" class="infl-list"></ul>
        </div>
      </div>

      <div class="panel">
        <div class="graph-head">
          <h2 class="section-title" style="margin:0">Graf powiązań</h2>
          <div id="graph-legend" class="legend"></div>
        </div>
        <div id="graph"></div>
      </div>
    </section>
  </main>

  <footer class="footer">
    Dane analizowane lokalnie przez silnik <code>social_analytics</code> (czysty JSON, bez sieci zewnętrznej).
  </footer>

  <script src="/static/app.js"></script>
</body>
</html>
