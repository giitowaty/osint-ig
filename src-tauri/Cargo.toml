[package]
name = "osint-ig"
version = "0.5.0"
description = "OSINT-IG: analiza profili Instagram i mapa powiązań (desktop)"
authors = ["Eryk Kunasz"]
license = "MIT"
edition = "2021"
rust-version = "1.77"

[lib]
name = "osint_ig_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
